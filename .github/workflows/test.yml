name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Run pure tests
        run: make test

  lua51-pure-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run Lua 5.1 tests
        run: make test-lua51 LUA=lua5.1

  windows-pure-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: choco install luajit -y
      - name: Run platform and editor tests
        shell: cmd
        run: |
          luajit tests/run.lua
          luajit tests/platform.lua
          luajit tests/editor.lua
          luajit tests/scope.lua
          luajit tests/lsp_protocol.lua
