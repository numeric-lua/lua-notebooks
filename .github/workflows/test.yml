name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Run pure tests
        run: make test
      - name: Remote gateway smoke
        run: make test-remote

  webapp-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check and test browser front-end
        run: make test-webapp

  lua51-pure-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run Lua 5.1 tests
        run: make test-lua51 LUA=lua5.1

  windows-pure-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # The Chocolatey package is gone; MSYS2 ships a maintained UCRT64
          # build.  Refresh the package database only if the stale runner image
          # cannot resolve it.
          & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-luajit
          if ($LASTEXITCODE -ne 0) {
            & C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-luajit
          }
          if ($LASTEXITCODE -ne 0) { throw "pacman failed to install LuaJIT" }
          # Add-Content (Windows PowerShell 5.1) writes no BOM; Out-File -Encoding
          # utf8 would prefix the path with U+FEFF and break luajit resolution.
          Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"
      - name: Run platform and editor tests
        shell: cmd
        run: |
          luajit -v
          luajit tests/run.lua
          luajit tests/runtime.lua
          luajit tests/engine.lua
          luajit tests/inline_supervisor.lua
          luajit tests/platform.lua
          luajit tests/editor.lua
          luajit tests/scope.lua
          luajit tests/lsp_protocol.lua
